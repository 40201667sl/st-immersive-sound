<div class="st-is-tab-content" id="st-is-tab-local-tts">
    <div class="st-is-settings-section">
        <h3>本地 TTS</h3>
        <div id="st-is-local-tts-status" class="st-is-help-text st-is-local-tts-status">请先填写手机转发器地址，再同步引擎和音色。</div>

        <div class="st-is-field">
            <label for="st-is-local-tts-enabled">启用本地 TTS</label>
            <div class="st-is-toggle">
                <input type="checkbox" id="st-is-local-tts-enabled">
                <span class="st-is-slider"></span>
            </div>
        </div>

        <div class="st-is-field">
            <label for="st-is-local-tts-base-url">手机转发器地址</label>
            <input type="text" class="st-is-text-input st-is-local-tts-input" id="st-is-local-tts-base-url" placeholder="例如：http://192.168.1.8:4244">
        </div>

        <div class="st-is-field">
            <button type="button" class="st-is-btn" id="st-is-local-tts-sync-engines">同步引擎</button>
            <button type="button" class="st-is-btn secondary" id="st-is-local-tts-save">保存设置</button>
        </div>

        <div class="st-is-field">
            <label for="st-is-local-tts-engine">本地引擎</label>
            <select id="st-is-local-tts-engine" class="st-is-select st-is-local-tts-input"></select>
        </div>

        <div class="st-is-field">
            <button type="button" class="st-is-btn" id="st-is-local-tts-sync-voices">同步音色</button>
        </div>

        <div class="st-is-field">
            <label for="st-is-local-tts-voice">本地音色</label>
            <select id="st-is-local-tts-voice" class="st-is-select st-is-local-tts-input"></select>
        </div>

        <div class="st-is-field">
            <label for="st-is-local-tts-rate">语速</label>
            <input type="number" class="st-is-range-input st-is-local-tts-number" id="st-is-local-tts-rate" min="1" max="100" value="50">
        </div>

        <div class="st-is-field">
            <label for="st-is-local-tts-pitch">音调</label>
            <input type="number" class="st-is-range-input st-is-local-tts-number" id="st-is-local-tts-pitch" min="1" max="300" value="100">
        </div>

        <div class="st-is-field">
            <button type="button" class="st-is-btn" id="st-is-local-tts-add-speaker">添加到主音色列表</button>
        </div>
    </div>

    <div class="st-is-settings-section">
        <h4>已添加的本地音色</h4>
        <div id="st-is-local-tts-speaker-list"></div>
    </div>

    <div class="st-is-settings-section">
        <h4>音色与角色匹配设定</h4>
        <div class="st-is-field">
            <label for="st-is-local-tts-char-match-profile-select">匹配设定</label>
            <div class="st-is-profile-controls">
                <select id="st-is-local-tts-char-match-profile-select" class="st-is-select"></select>
                <button type="button" class="st-is-icon-btn" id="st-is-local-tts-char-match-save" title="保存"><i class="fa-solid fa-save"></i></button>
                <button type="button" class="st-is-icon-btn" id="st-is-local-tts-char-match-save-as" title="另存为"><i class="fa-solid fa-floppy-disk"></i></button>
                <button type="button" class="st-is-icon-btn" id="st-is-local-tts-char-match-import" title="导入"><i class="fa-solid fa-file-import"></i></button>
                <button type="button" class="st-is-icon-btn" id="st-is-local-tts-char-match-export" title="导出"><i class="fa-solid fa-file-export"></i></button>
                <button type="button" class="st-is-icon-btn" id="st-is-local-tts-char-match-export-all" title="导出全部"><i class="fa-solid fa-folder-open"></i></button>
                <button type="button" class="st-is-icon-btn danger" id="st-is-local-tts-char-match-delete" title="删除"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="st-is-field-col">
            <label for="st-is-local-tts-char-match-rules-editor">规则设定</label>
            <textarea id="st-is-local-tts-char-match-rules-editor" class="st-is-textarea" rows="5" placeholder="输入格式为：使用自然语言描述本地音色名称和角色名称的匹配关系"></textarea>
        </div>
    </div>

    <div class="st-is-settings-section">
        <h4>测试朗读</h4>
        <div class="st-is-field">
            <textarea id="st-is-local-tts-test-text" class="st-is-textarea" rows="3">你好，这是本地 TTS 测试。</textarea>
        </div>
        <div class="st-is-field">
            <textarea id="st-is-local-tts-test-context" class="st-is-textarea" rows="2" placeholder="输入语气控制，例如：温柔、低声、带一点委屈"></textarea>
        </div>
        <div class="st-is-field">
            <button type="button" class="st-is-btn" id="st-is-local-tts-test">播放测试</button>
        </div>
        <audio id="st-is-local-tts-audio" controls></audio>
    </div>

</div>
